services:
  web:
    image: php:8.2-apache
    container_name: heart_web
    ports:
      - "8888:80"
    volumes:
      - ./backend:/var/www/html
      - ./vhost.conf:/etc/apache2/sites-available/000-default.conf
      # 🚀 On prend le vrai dossier frontend de la racine et on l'injecte au bon endroit !
      - ./frontend:/var/www/html/public/frontend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: heart_db
      DB_USER: root
      DB_PASS: root
    command: >
      bash -c "a2enmod rewrite 
      && docker-php-ext-install pdo_mysql 
      && apache2-foreground"

  db:
    image: mysql:8.0
    container_name: heart_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: heart_db
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: heart_phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

volumes:
  mysql_data:
